name: CI

# Quand : à chaque push, sur toutes les branches, et à chaque pull request.
on:
  push:
    branches: ['**']
  pull_request:

# Si tu pousses deux fois de suite, l'ancienne vérification est annulée.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Le CI peut seulement LIRE le dépôt (principe du moindre privilège).
permissions:
  contents: read

jobs:
  verifier:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest

    # Base PostgreSQL jetable pour les tests de bout en bout.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: relnis
          POSTGRES_PASSWORD: relnis_ci
          POSTGRES_DB: relnis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relnis -d relnis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://relnis:relnis_ci@localhost:5432/relnis?schema=public
      # Exigés au démarrage de l'API ; les tests gardent les courriels en mémoire (aucun envoi).
      SMTP_URL: smtp://localhost:1025
      COURRIEL_EXPEDITEUR: Relnis <ne-pas-repondre@relnis.local>
      URL_WEB: http://localhost:5173
      JWT_SECRET: cle-du-ci-sans-valeur-hors-des-tests

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node (version de .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances (versions exactes du package-lock.json)
        run: npm ci

      # Le client Prisma n'est pas dans Git : on le génère.
      - name: Générer le client Prisma
        run: npm run db:generate -w @relnis/api

      - name: Appliquer les migrations
        run: npm run db:deploy -w @relnis/api

      - name: Vérifier le code (lint)
        run: npm run lint

      - name: Vérifier les types
        run: npm run typecheck

      - name: Lancer les tests
        run: npm run test

      - name: Construire les applications
        run: npm run build

      - name: Chercher les failles connues dans les dépendances
        run: npm audit --audit-level=high