# Services du développement local UNIQUEMENT (données fausses, jamais de vraies données).
# Démarrer : docker compose up -d     Arrêter : docker compose down
name: relnis

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: relnis
      POSTGRES_PASSWORD: relnis_dev
      POSTGRES_DB: relnis
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relnis -d relnis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data: